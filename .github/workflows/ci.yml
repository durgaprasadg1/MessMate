name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Automated tests (unit + authorization + static guards)
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    env:
      # dummy values: the build never contacts these services
      NODE_ENV: production
      NEXTAUTH_SECRET: ci-build-secret-ci-build-secret-ci-build-secret
      NEXTAUTH_URL: https://ci.example.com
      NEXT_PUBLIC_BASE_URL: https://ci.example.com
      SUPABASE_URL: https://ci.example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: No source maps in the production bundle
        run: |
          if find .next/static -name '*.map' | grep -q .; then
            echo "Source maps found in .next/static"; exit 1
          fi

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: npm audit (production dependencies, high and above)
        run: npm run audit:prod

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed)
        run: |
          docker build -t messmate:ci .
